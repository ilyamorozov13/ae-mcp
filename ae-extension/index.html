<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AE MCP Bridge</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="container">
        <h1>AE MCP Bridge</h1>
        <div id="status">
            <div class="status-label">Server Status:</div>
            <div id="server-status" class="status-value">Disconnected</div>
        </div>
        
        <div id="connection">
            <input type="text" id="server-host" placeholder="localhost" value="localhost">
            <input type="number" id="server-port" placeholder="8080" value="8080">
            <button id="connect-btn">Connect</button>
        </div>
        
        <div id="log">
            <div class="log-label">Activity Log:</div>
            <div id="log-content"></div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
