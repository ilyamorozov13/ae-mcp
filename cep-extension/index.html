<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AE MCP Bridge</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AE MCP Bridge</h1>
            <div class="status" id="status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Ready</span>
            </div>
        </div>

        <div class="controls">
            <button id="btnClearLog" class="button">Clear Log</button>
            <button id="btnOpenFolder" class="button">Open Commands Folder</button>
            <button id="btnToggleAuto" class="button toggle active">Auto Process: ON</button>
            <button id="btnToggleDebug" class="button toggle">Debug Mode: OFF</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Processed:</span>
                <span class="stat-value" id="statProcessed">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Errors:</span>
                <span class="stat-value error" id="statErrors">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Last Check:</span>
                <span class="stat-value" id="statLastCheck">Never</span>
            </div>
        </div>

        <div class="recent-errors" id="recentErrors" style="display: none;"></div>

        <div class="log-container">
            <div class="log-header">
                <h3>Command Log</h3>
                <span class="log-count" id="logCount">0 entries</span>
            </div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <!-- CEP JavaScript Interface -->
    <script type="text/javascript" src="js/CSInterface.js"></script>
    <!-- Main application script -->
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
